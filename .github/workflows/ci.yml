name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' -e packages/newbrain-router
      - run: python -m pytest
      - run: python -m pytest packages/newbrain-router/tests
      - run: python scripts/public_safety_scan.py
